<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="popup.css">
    <link rel="stylesheet" type="text/css" href="popup_template.css">
    <meta charset="utf-8">
</head>

<body>
    <div id="popup">
        <div id="popup-content">
            <div id="popup-header" class="round">
                <span id="popup-title">settings</span>
            </div>
            <div id="popup-body">
                <div class="setting">
                    <span class="settings_text">カウントダウン</span>
                    <span class="settings_button">
                        <!-- toggle button -->
                        <input type="checkbox" id="countdown" class="checkbox">
                        <label for="countdown" class="btn" ></label>
                    </span>
                </div>
                
            </div>
            <div id="popup-footer">
                <input type="button" class="btn full-width" id="reload_page" value="再読み込み">
            </div>
        </div>
    </div>
    
    
    <script src="popup.js"></script>
</html>
