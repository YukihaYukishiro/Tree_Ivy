<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="../css/popup/popup.css">
    <link rel="stylesheet" type="text/css" href="../css/popup/popup_template.css">
    <meta charset="utf-8">
</head>

<body>
    <div id="popup">
        <div id="popup-content">
            <div id="popup-header" class="round">
                <span id="popup-title">Tree-Ivy</span>
                <a id="Discord_icon" href="https://discord.gg/KXFbwAFaA7" target="_blank"><img src="../images/discord_icon_130958.webp" alt=""></a>
            </div>

            


            <div id="popup-body">

                <details class="category" id="indicator" open>
                    <summary class="category-title">
                        <span>Tree-Ivy インジケータ</span>
                    </summary>
                    
                    <div class="description">時間割およびマイページに表示される<br>インジケータの設定</div>

                    <div class="option">
                        <span class="option-title">欠席状況表示</span>
                        <label class="switch">
                            <span>欠席数</span>
                            <input type="checkbox" id="countdown">
                            <span>カウントダウン</span>
                        </label>
                    </div>

                </details>

                <details class="category" id="schedule" open>
                    <summary class="category-title">
                        <span>時間割</span>
                    </summary>

                    <div class="description">時間割の表示設定</div>

                    <div class="option">
                        <span class="option-title">左端の曜日</span>
                        <div class="choice">
                            <label>当日<input type="radio" name="startDay" value=0></label>
                            <label>月曜<input type="radio" name="startDay" value=1></label>
                            <label>日曜<input type="radio" name="startDay" value=2></label>
                        </div>
                    </div>

                    <div class="option">
                        <span class="option-title">出欠状況表示</span>
                        <label class="switch">
                            <span>通常</span>
                            <input type="checkbox" id="simpleAttendanceView">
                            <span>シンプル</span>
                        </label>
                    </div>

                    <div class="option">
                        <span class="option-title">コンパクトビュー</span>
                        <label class="switch">
                            <span>オフ</span>
                            <input type="checkbox" id="compactSchedule">
                            <span>オン</span>
                        </label>
                    </div>

                </details>

                <details class="category" id="other" open>
                    <summary class="category-title">
                        <span>その他の機能</span>
                    </summary>

                    <div class="description">その他の機能の設定</div>
                    <div class="option">
                        <span class="option-title">カレンダーからの出席ボタンの有効化</span>
                        <label class="switch">
                            <span>無効</span>
                            <input type="checkbox" id="attend_calendar">
                            <span>有効</span>
                        </label>
                    </div>
                </details>


                <details class="category" id="experimental">
                    <summary class="category-title">
                        <span>実験的機能</span>
                    </summary>

                    <div class="description">実験的な機能の設定</div>
                    <div class="option">
                        <span class="option-title">単位認定試験の日時(不正確)</span>
                        <label class="switch">
                            <span>非表示</span>
                            <input type="checkbox" id="show_examdate">
                            <span>表示</span>
                        </label>
                    </div>

                </details>

            </div>
        
        </div>
    </div>
    
    <script src="../backgrounds/popup/load.js"></script>
    <script src="../backgrounds/popup/set_event.js"></script>
</html>
