<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>設定画面</title>
    <script src="js/settings.js" defer></script>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #fffafc;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        #settings-container {
            max-width: 600px;
            margin: auto;
            background: #fdf6ff;
            border-radius: 16px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h2.category-title {
            font-size: 20px;
            margin-top: 30px;
            border-bottom: 2px solid #e0caff;
            padding-bottom: 8px;
            color: #7a5fbf;
        }

        .description {
            font-size: 14px;
            color: #777;
            margin-bottom: 12px;
        }

        .option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            background-color: #f4f1fa;
        }

        .option-title {
            font-size: 16px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        .switch input:checked + .slider {
            background-color: #d9a5f0;
        }

        .switch input:checked + .slider:before {
            transform: translateX(24px);
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #popup-title {
            font-size: 24px;
            font-weight: bold;
            color: #955ac9;
        }

        #Discord_icon img {
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body>

<div id="settings-container">
    <div id="header">
        <span id="popup-title">Tree-Ivy</span>
        <a id="Discord_icon" href="https://discord.gg/KXFbwAFaA7" target="_blank">
            <img src="../images/discord_icon_130958.webp" alt="Discord">
        </a>
    </div>

    <div id="settings-body">

        <h2 class="category-title">時間割</h2>
        <div class="description">時間割の表示設定</div>
        <div class="option">
            <span class="option-title">スタイリッシュな出欠状況表示</span>
            <label class="switch">
                <input type="checkbox" id="simpleAttendanceView">
                <span class="slider"></span>
            </label>
        </div>
        <div class="option">
            <span class="option-title">コンパクトな時間割</span>
            <label class="switch">
                <input type="checkbox" id="compactSchedule">
                <span class="slider"></span>
            </label>
        </div>

        <h2 class="category-title">その他の機能</h2>
        <div class="description">その他の機能の設定</div>
        <div class="option">
            <span class="option-title">カレンダーからの出席ボタンの有効化</span>
            <label class="switch">
                <input type="checkbox" id="attend_calendar">
                <span class="slider"></span>
            </label>
        </div>
        <div class="option">
            <span class="option-title">スプリットビュー</span>
            <label class="switch">
                <input type="checkbox" id="enable_splitview">
                <span class="slider"></span>
            </label>
        </div>
        <div class="option">
            <span class="option-title">マイページで課題を別タブで開く</span>
            <label class="switch">
                <input type="checkbox" id="mypage_newtab">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

</body>
</html>
